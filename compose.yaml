services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dira_dev
      POSTGRES_USER: dira_dev
      POSTGRES_PASSWORD: dira_local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dira-postgres-data:/var/lib/postgresql/data
      - ./lib/db/dataset_schema.sql:/docker-entrypoint-initdb.d/001-dataset-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dira_dev -d dira_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dira-postgres-data:
